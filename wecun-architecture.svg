  <line x1="480" y1="143" x2="480" y2="165" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="845" y1="143" x2="845" y2="165" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

