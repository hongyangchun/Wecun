  <line x1="398" y1="440" x2="540" y2="440" stroke="#059669" stroke-width="1.5"/>
  <line x1="540" y1="440" x2="540" y2="475" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="536" y1="403" x2="536" y2="420" stroke="#059669" stroke-width="1.5"/>
