  <line x1="835" y1="420" x2="835" y2="475" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="720" y1="403" x2="720" y2="475" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

