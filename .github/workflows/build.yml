name: Build Desktop App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libssl-dev
      - run: cd src-tauri && cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            build_args: "--target universal-apple-darwin --bundles app,dmg"
            artifact_name: macos
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            build_args: "--bundles nsis"
            artifact_name: windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            build_args: "--bundles deb,appimage"
            artifact_name: linux
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libssl-dev

      - name: Add Rust targets for macOS universal binary
        if: matrix.rust_targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - run: npm install

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- ${{ matrix.build_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: wecun-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}

  create-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: wecun-macos
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: wecun-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: wecun-linux
          path: artifacts/linux

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename artifacts with Wecun prefix
        shell: bash
        run: |
          # Rename macOS files
          for f in artifacts/macos/*.dmg; do
            [ -f "$f" ] && mv "$f" "artifacts/macos/Wecun_$(basename $f)"
          done
          for f in artifacts/macos/*.app.tar.gz; do
            [ -f "$f" ] && mv "$f" "artifacts/macos/Wecun_$(basename $f)"
          done
          for f in artifacts/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "artifacts/macos/Wecun_$(basename $f)"
          done
          # Rename Windows files
          for f in artifacts/windows/*.exe; do
            [ -f "$f" ] && mv "$f" "artifacts/windows/Wecun_$(basename $f)"
          done
          # Rename Linux files
          for f in artifacts/linux/*.deb; do
            [ -f "$f" ] && mv "$f" "artifacts/linux/Wecun_$(basename $f)"
          done
          for f in artifacts/linux/*.AppImage; do
            [ -f "$f" ] && mv "$f" "artifacts/linux/Wecun_$(basename $f)"
          done
          # List final artifact structure for debugging
          echo "=== Final artifact structure ==="
          find artifacts -type f | sort

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/macos/Wecun_*.dmg
            artifacts/macos/Wecun_*.app.tar.gz
            artifacts/macos/Wecun_*.app.tar.gz.sig
            artifacts/windows/Wecun_*.exe
            artifacts/linux/Wecun_*.deb
            artifacts/linux/Wecun_*.AppImage

      - name: Generate latest.json for updater
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          # Read macOS signature
          SIG_FILE=$(ls artifacts/macos/Wecun_*.app.tar.gz.sig 2>/dev/null | head -1)
          MAC_SIG=""
          if [ -n "$SIG_FILE" ]; then
            MAC_SIG=$(cat "$SIG_FILE")
          fi

          # Get macOS tar.gz filename
          MAC_TAR=$(ls artifacts/macos/Wecun_*.app.tar.gz 2>/dev/null | head -1 | xargs basename)

          cat > latest.json <<EOF
          {
            "version": "v${VERSION}",
            "notes": "See the release notes at https://github.com/${REPO}/releases/tag/v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-universal": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/${MAC_TAR}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/${MAC_TAR}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/${MAC_TAR}"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: latest.json
