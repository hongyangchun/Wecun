name: Build Desktop App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request replaces its older run. A release in progress on main is left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # Every push to main publishes a release. Refuse to reuse a version before ten minutes are spent on builds.
      - name: Refuse to overwrite an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "v${version}" --json tagName >/dev/null 2>&1; then
            echo "::error::Release v${version} already exists. Raise the version in package.json, package-lock.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml before pushing to main."
            exit 1
          fi
          echo "v${version} is free to publish."

      - name: Version numbers agree
        run: node scripts/release.mjs check-versions

      - run: npm ci

      - run: npm run build

      - run: npm test -- --run

      - name: Build the landing page
        working-directory: landing
        run: |
          npm ci
          npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libssl-dev

      - run: cd src-tauri && cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            build_args: "--target universal-apple-darwin --bundles app,dmg"
            artifact_name: macos
            # The .app.tar.gz and its .sig are what the in-app updater installs.
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            build_args: "--bundles nsis"
            artifact_name: windows
            # The installer and its .sig are what the in-app updater runs.
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - os: ubuntu-latest
            build_args: "--bundles deb,appimage"
            artifact_name: linux
            # The .deb and the .AppImage, each with its .sig, are what the in-app updater installs.
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libssl-dev

      - name: Add Rust targets for macOS universal binary
        if: matrix.rust_targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- ${{ matrix.build_args }}

      # Bash on every runner: on Windows a bare `find` is PowerShell's alias for Get-ChildItem.
      - name: List bundle output
        shell: bash
        run: find src-tauri/target -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.sig' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) | sort

      - uses: actions/upload-artifact@v4
        with:
          name: wecun-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}

  # Rehearses the release on every pull request: the script that assembles a real release fails here
  # when any installer or updater file is missing or ambiguous.
  release-check:
    name: Assemble release (rehearsal)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: wecun-*
          path: artifacts

      - name: Rename installers and write the updater manifest
        run: >-
          node scripts/release.mjs prepare
          --dir artifacts
          --version "$(node -p "require('./package.json').version")"
          --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wecun-release
          path: artifacts/release
          if-no-files-found: error

  create-release:
    name: Publish release
    needs: [test, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: wecun-release
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Installers, their version-less copies, the updater bundles with their signatures, and latest.json.
          files: release/*
